services:
  mysql:
    image: mysql:8.0
    container_name: cap43-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cap43
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database:/docker-entrypoint-initdb.d/scripts:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cap43-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cap43-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - cap43-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cap43-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cap43-net

volumes:
  mysql_data:
    driver: local

networks:
  cap43-net:
    driver: bridge
