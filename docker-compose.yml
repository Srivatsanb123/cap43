services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # Initialized with root:root credentials and automatic schema/seed execution
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: cap43-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cap43
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database:/docker-entrypoint-initdb.d/scripts:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cap43-net

  # ----------------------------------------------------------------------------
  # 2. Spring Boot Backend Service (REST API)
  # Connects to MySQL container with root credentials and port 8080
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cap43-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: cap43
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      CORS_ALLOWED_ORIGINS: "*"
      APP_DEMO_ENABLED: "true"
      APP_DEMO_PASSWORD: "Demo@12345"
      APP_EVIDENCE_MODE: "local"
      JWT_SECRET: "c2VjdXJlLWNhcDQzLXByb3BlcnR5LW1haW50ZW5hbmNlLWRlcG9zaXQtZGlzcHV0ZS1sZWRnZXItc2VjcmV0LWtleS0yMDI2"
      JWT_TTL_MINUTES: "60"
      AWS_S3_BUCKET: ""
      AWS_REGION: ""
      PYTHON_PATH: "python"
      SYNC_SCRIPT_PATH: ""
    ports:
      - "8080:8080"
    networks:
      - cap43-net

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Nginx)
  # Serves compiled SPA and proxies /api requests to backend container
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cap43-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cap43-net

volumes:
  mysql_data:
    driver: local

networks:
  cap43-net:
    driver: bridge

