server.port=${SERVER_PORT}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.demo.enabled=${APP_DEMO_ENABLED}
app.demo.password=${APP_DEMO_PASSWORD}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.evidence.mode=${APP_EVIDENCE_MODE}
app.evidence.s3.bucket=${AWS_S3_BUCKET}
app.evidence.s3.region=${AWS_REGION}

app.sync.python-path=${PYTHON_PATH}
app.sync.script-path=${SYNC_SCRIPT_PATH}
